name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Tipos, pruebas unitarias y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rules:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/firebase/emulators, key: firebase-emulators-v1 }
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: Flujo completo (emuladores + Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-nir
      NEXT_PUBLIC_PUBLIC_URL: http://localhost:3000
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/firebase/emulators, key: firebase-emulators-v1 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Emuladores, datos de prueba y flujo
        run: |
          npx firebase emulators:exec --only auth,firestore --project demo-nir "\
            npm run seed && \
            (npx next start -p 3000 > next.log 2>&1 &) && \
            npx --yes wait-on -t 60000 http://localhost:3000 && \
            npx playwright test || (echo '--- next.log ---'; cat next.log; echo '--- pagina ---'; cat test-results/*/error-context.md; exit 1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: |
            test-results/
            playwright-report/
            next.log
          retention-days: 14
